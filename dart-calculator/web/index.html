<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="scaffolded-by" content="https://github.com/dart-lang/sdk" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="main.dart.js"></script>
  </head>

  <body>
    <div class="calculatorContainer">
      <div class="display"></div>
      <div class="operatorOperandContainer">
        <div class="operandsContainer">
          <button class="operands">1</button>
          <button class="operands">2</button>
          <button class="operands">3</button>
          <button class="operands">4</button>
          <button class="operands">5</button>
          <button class="operands">6</button>
          <button class="operands">7</button>
          <button class="operands">8</button>
          <button class="operands">9</button>
          <button class="non-operand">
            'Backspace' for 'Delete' & 'Escape' for 'Clear'
          </button>
          <button class="operands">0</button>
          <button class="operands">.</button>
        </div>
        <div class="operatorContainer">
          <button class="operators">Delete</button>
          <button class="operators">+</button>
          <button class="operators">-</button>
          <button class="operators">*</button>
          <button class="operators">/</button>
          <button class="operators">=</button>
          <button class="operators">Clear</button>
        </div>
      </div>
    </div>
  </body>
</html>
